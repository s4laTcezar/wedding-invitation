<nav class="tabs">
  @for (tab of tabs; track tab.path) {
    <a
      class="tabs__item"
      [routerLink]="tab.path"
      routerLinkActive="tabs__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ tab.label }}
      <span class="tabs__dot"></span>
    </a>
  }
</nav>
